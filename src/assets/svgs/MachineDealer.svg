<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 120 72" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
  <!-- Control monitor (top-left, above feeder) -->
  <rect x="2" y="2" width="11" height="8" rx="1"/>
  <!-- Monitor neck -->
  <rect x="6" y="10" width="3" height="3"/>

  <!-- Paper feeder (left) — stack of horizontal sheet lines + platform -->
  <rect x="2" y="15" width="13" height="2"   rx="0.5"/>
  <rect x="2" y="19" width="13" height="2"   rx="0.5"/>
  <rect x="2" y="23" width="13" height="2"   rx="0.5"/>
  <rect x="1" y="26" width="15" height="5"   rx="1.5"/>

  <!-- Ink rollers — 2 small circles sitting above each print unit -->
  <circle cx="23" cy="13" r="2.5"/>
  <circle cx="30" cy="13" r="2.5"/>

  <circle cx="44" cy="13" r="2.5"/>
  <circle cx="51" cy="13" r="2.5"/>

  <circle cx="65" cy="13" r="2.5"/>
  <circle cx="72" cy="13" r="2.5"/>

  <circle cx="86" cy="13" r="2.5"/>
  <circle cx="93" cy="13" r="2.5"/>

  <!-- Print Unit 1 — body with cylinder cut-out (evenodd) -->
  <path fill-rule="evenodd" d="M18 19 L37 19 L37 42 L18 42 Z M27.5 26 A4.5 4.5 0 0 0 27.5 35 A4.5 4.5 0 0 0 27.5 26 Z"/>

  <!-- Print Unit 2 -->
  <path fill-rule="evenodd" d="M39 19 L58 19 L58 42 L39 42 Z M48.5 26 A4.5 4.5 0 0 0 48.5 35 A4.5 4.5 0 0 0 48.5 26 Z"/>

  <!-- Print Unit 3 -->
  <path fill-rule="evenodd" d="M60 19 L79 19 L79 42 L60 42 Z M69.5 26 A4.5 4.5 0 0 0 69.5 35 A4.5 4.5 0 0 0 69.5 26 Z"/>

  <!-- Print Unit 4 -->
  <path fill-rule="evenodd" d="M81 19 L100 19 L100 42 L81 42 Z M90.5 26 A4.5 4.5 0 0 0 90.5 35 A4.5 4.5 0 0 0 90.5 26 Z"/>

  <!-- Paper delivery (right) — stacked sheets + platform -->
  <rect x="103" y="15" width="13" height="2"  rx="0.5"/>
  <rect x="103" y="19" width="13" height="2"  rx="0.5"/>
  <rect x="103" y="23" width="13" height="2"  rx="0.5"/>
  <rect x="103"  y="26" width="15" height="5" rx="1.5"/>

  <!-- Main machine body / frame (connects all 4 units) -->
  <rect x="1" y="42" width="117" height="18" rx="2"/>

  <!-- Base legs -->
  <rect x="5"   y="60" width="8" height="8" rx="1"/>
  <rect x="30"  y="60" width="8" height="8" rx="1"/>
  <rect x="57"  y="60" width="8" height="8" rx="1"/>
  <rect x="84"  y="60" width="8" height="8" rx="1"/>
  <rect x="109" y="60" width="8" height="8" rx="1"/>
</svg>
